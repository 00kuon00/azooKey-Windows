syntax = "proto3";

package window;

// 候補ウィンドウの位置を示すメッセージ
message WindowPosition {
  int32 top = 1;
  int32 left = 2;
  int32 bottom = 3;
  int32 right = 4;
}

// 候補ウィンドウの位置設定メッセージ
message SetPositionRequest {
  WindowPosition position = 1; // 設定するウィンドウの位置
}

// 打ち間違いを直した「もしかして」（候補ウィンドウの #typo-row に出す）
message TypoCandidate {
  string text = 1;     // 直した読みを変換した 1 位
  string hiragana = 2; // 直した読み
}

// 変換候補を送るメッセージ
message SetCandidateRequest {
  repeated string candidates = 1;
  // 打った読み（#reading に出す）。空なら読みの行を出さない
  string hiragana = 2;
  // Shift+←→ で区切った最初の文節の読みの文字数。0 なら区切っていない
  int32 segment_length = 3;
  // 入力中の読みの続きを補った予測（#prediction-row）
  repeated string predictions = 4;
  // 打ち間違いを直した「もしかして」（#typo-row）
  repeated TypoCandidate typo_corrections = 5;
}

// どこの候補を選んでいるか
enum SelectionKind {
  CANDIDATE = 0;  // 変換候補の一覧（#candidate-list）
  PREDICTION = 1; // 予測（#prediction-row）
  TYPO = 2;       // もしかして（#typo-row）
}

// 変換候補を選択するメッセージ
message SetSelectionRequest {
  int32 index = 1;
  SelectionKind kind = 2;
}

message SetInputModeRequest {
  string mode = 1;
}

// 候補ウィンドウ制御に対する空のレスポンス
message EmptyResponse {}

// 候補ウィンドウの制御サービス定義
service WindowService {
  rpc ShowWindow (EmptyResponse) returns (EmptyResponse); // ウィンドウを表示
  rpc HideWindow (EmptyResponse) returns (EmptyResponse); // ウィンドウを非表示
  rpc SetCandidate (SetCandidateRequest) returns (EmptyResponse); // 候補の設定
  rpc SetSelection (SetSelectionRequest) returns (EmptyResponse); // 変換候補を選択
  rpc SetWindowPosition (SetPositionRequest) returns (EmptyResponse); // ウィンドウの位置を設定
  rpc SetInputMode (SetInputModeRequest) returns (EmptyResponse); // 変換モードの設定
}
