syntax = "proto3";

package azookey;

message Suggestion {
  string text = 1;    // The main suggestion text.
  string subtext = 2; // Additional information or subtext for the suggestion.
  int32 corresponding_count = 3;
}

// ComposingText represents the text and its associated suggestions.
message ComposingText {
  string hiragana = 1; // The main text content.
  repeated Suggestion suggestions = 2; // List of suggestions for the text.
  // 入力中の読みの続きを補った予測（「おはよ」→「おはよう」）。suggestions とは別に並べ、ライブ変換の 1 位には使わない。
  // 確定すると入力中の文字列をすべて使う（subtext は空、corresponding_count は入力全体）
  repeated Suggestion predictions = 3;
}

// Request message for AppendText.
message AppendTextRequest {
  string text_to_append = 1; // The text to append to the current content.
}

// Response message for AppendText.
message AppendTextResponse {
  ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Request message for RemoveText.
message RemoveTextRequest {}

// Response message for RemoveText.
message RemoveTextResponse {
  ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Request message for MoveCursor.
message MoveCursorRequest {
  int32 offset = 1; // The new cursor position.
}

// Request message for ShrinkText.
message ShrinkTextRequest {
  int32 offset = 1;
}

message ShrinkTextResponse {
    ComposingText composing_text = 1; // The resulting text and suggestions.
}

// 最初の文節の読みの長さを決める（Shift+←→）。候補はその長さの読みを 1 つの文節として変換したものになる
message SetSegmentRequest {
  int32 surface_count = 1; // 文節の読みの文字数（ひらがなの文字数）
}

message SetSegmentResponse {
  ComposingText composing_text = 1;
}

// Response message for MoveCursor.
message MoveCursorResponse {
  ComposingText composing_text = 1; // The resulting text and suggestions.
}

// Request message for ClearText.
message ClearTextRequest {}

// Response message for ClearText.
message ClearTextResponse {}

message SetContextRequest {
  string context = 1;
}

message SetContextResponse {}

// ユーザー辞書の 1 語（%APPDATA%\Azookey\user_dictionary.json の要素と同じ形）
message UserDictionaryEntry {
  string reading = 1; // 読み（ひらがな）
  string word = 2;    // 単語
}

message UpdateConfigRequest {}
message UpdateConfigResponse {
  // ユーザー辞書を作り直したとき、読みに辞書で使えない文字があって登録できなかった語
  repeated UserDictionaryEntry unregistered_user_dictionary_entries = 1;
}

// 候補が確定したことを伝える（学習に使う）
message CommitCandidateRequest {
  string text = 1; // 確定した候補の文字列（Suggestion.text）
}
message CommitCandidateResponse {}

// 学習をすべて消す
message ResetLearningRequest {}
message ResetLearningResponse {}

// 候補の学習だけを忘れる（候補選択中の Ctrl+Delete）。入力中の文字列はそのままで、候補を取り直して返す
message ForgetCandidateRequest {
  string text = 1; // 忘れる候補の文字列（Suggestion.text）
}
message ForgetCandidateResponse {
  ComposingText composing_text = 1;
}

// 確定済みの文字列を再変換する。サーバは読みを推定し、入力中の文字列をその読みにして候補を返す
message StartReconversionRequest {
  string text = 1; // 再変換する文字列（選択範囲）
}
// 打ち間違いを直した「もしかして」を求める（Zenzai が有効なときだけ返る）
message RequestTypoCorrectionRequest {}
message TypoCorrection {
  string text = 1;     // 直した読みを変換した 1 位
  string hiragana = 2; // 直した読み
  int32 corresponding_count = 3; // 入力全体の文字数（確定すると入力中の文字列をすべて使う）
}
message RequestTypoCorrectionResponse {
  repeated TypoCorrection corrections = 1;
}

message StartReconversionResponse {
  // hiragana は推定した読み。推定できなければ hiragana は空で候補も無い
  ComposingText composing_text = 1;
}

// ユーザー辞書の登録候補（#17）: 語が登録しなくても変換できるか（読みを入力したとき候補の上位に出るか）を調べる
message ConvertibilityQuery {
  string word = 1;
  string reading = 2; // 読み（ひらがな）。空ならサーバが辞書から推定する
}
message ConvertibilityResult {
  string word = 1;
  string reading = 2; // 調べるのに使った読み。推定できなければ空
  bool convertible = 3;
}
message CheckConvertibilityRequest {
  // IME の変換と同じスレッドで調べるので、1 回に送る数は少なくする（その間の変換が待たされる）
  repeated ConvertibilityQuery queries = 1;
}
message CheckConvertibilityResponse {
  repeated ConvertibilityResult results = 1;
}

// Service definition for text editing operations.
service AzookeyService {
  rpc AppendText (AppendTextRequest) returns (AppendTextResponse);
  rpc RemoveText (RemoveTextRequest) returns (RemoveTextResponse);
  rpc ShrinkText (ShrinkTextRequest) returns (ShrinkTextResponse);
  rpc SetSegment (SetSegmentRequest) returns (SetSegmentResponse);
  rpc MoveCursor (MoveCursorRequest) returns (MoveCursorResponse);
  rpc ClearText (ClearTextRequest) returns (ClearTextResponse);
  rpc SetContext (SetContextRequest) returns (SetContextResponse);
  rpc UpdateConfig (UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc CommitCandidate (CommitCandidateRequest) returns (CommitCandidateResponse);
  rpc ResetLearning (ResetLearningRequest) returns (ResetLearningResponse);
  rpc ForgetCandidate (ForgetCandidateRequest) returns (ForgetCandidateResponse);
  rpc StartReconversion (StartReconversionRequest) returns (StartReconversionResponse);
  rpc RequestTypoCorrection (RequestTypoCorrectionRequest) returns (RequestTypoCorrectionResponse);
  rpc CheckConvertibility (CheckConvertibilityRequest) returns (CheckConvertibilityResponse);
}
